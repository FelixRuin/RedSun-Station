author: Herobrine998
delete-after: true
changes:
  - balance: 'Снижено здоровье корпусов свармеров в 2.5 раза: Базовый корпус: 45 HP,
      Дрон: 40 HP, Универсал: 100 HP, Разведчик: 60 HP, Боец: 120 HP, Строитель: 120
      HP'
  - balance: Прочность штурмовых турелей снижена на 15%, со 150 до 130 HP
  - balance: Добавлены КД на ловушки. После успешной установки ловушки запускается
      перезарядка на 6 секунд. Оставшееся время перезарядки отображается непосредственно
      на кнопке способности
  - balance: 'Добавлены общие лимиты на постройки роя. За каждого действующего свармера
      рой получает: 4 места под штурмовые турели, 3 места под снайперские турели,
      3 места под установки ACP, 1 место под ремонтную станцию. Лимиты общие для всего
      роя и отображаются во вкладке «Статус». При гибели свармера доступные лимиты
      уменьшаются, но уже возведенные постройки не уничтожаются. Остальные постройки
      по-прежнему не имеют количественных ограничений'
  - balance: Переработано воздействие анализатора на организм. Анализатор больше не
      извлекает органы. С вероятностью 10% происходит ампутация одной случайной конечности.
      Отсеченная конечность полностью удаляется. Если ампутация не произошла, вместо
      нее возникает перелом
  - rscadd: Добавлено извлечение имплантов. С вероятностью 40% анализатор удаляет
      один случайный имплант, если он имеется. За извлеченный имплант рой получает
      10 металла. Импланты-чипы (например, МЩ) не затрагиваются
  - rscadd: Изменен процесс появления мегасвармера. Мегасвармер появляется на карте
      еще до начала опроса призраков. Его спрайт отображается на иконке голосования.
      После завершения опроса свободный корпус можно занять через гост-меню или нажатием
      на тело, если его никто не занял во время голосования
  - balance: Увеличено время на уничтожение ядра свармеров. С момента первого призыва
      мегасвармера экипаж получает 12 минут (вместо прежних 6 минут)
  - balance: Изменено время эвакуации после победы роя. 3 минуты на прибытие шаттла
      к станции, 1 минута на посадку экипажа, 1 минута на перелет до ЦК
  - balance: Добавлены ограничения для свармеров в секторе ЦК после завершения раунда.
      Блокируются атаки, телепортация, строительство и другие способности. Турели
      и ловушки роя прекращают атаковать
  - rscdel: Событие GLaDOS больше не изменяет внешний вид и звуки турелей свармеров
  - rscadd: Свармеры понимают все языки, но разговаривать могут только на свармерском
