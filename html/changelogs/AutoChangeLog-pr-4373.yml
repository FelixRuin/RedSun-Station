author: DuLL-FoX
delete-after: true
changes:
  - bugfix: Сервер больше не замирает на доли секунды из-за меток времени в логах
      и отпечатках.
  - bugfix: Сохранение настроек и персонажа меньше подвешивает сервер.
  - bugfix: Выход игрока с сервера реже даёт лаг-спайк.
  - bugfix: Мобы и боты ходят кратчайшим путём и меньше грузят сервер толпой.
  - bugfix: Силы кровососа, гипновзгляд, обмотки священника и взлом APC больше не
      сыпят ошибками; кнопки блокировки и осушения APC доступны только взломщику.
  - config: PLAYER_SAVEFILE_HOLD - удержание файла сейва открытым на время сессии.
