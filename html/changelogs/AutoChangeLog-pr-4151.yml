author: DuLL-FoX
delete-after: true
changes:
  - rscadd: 'Кровные братья переделаны: клятва из трёх шагов на выбор из десяти, обеты,
      печати кровью и связь, которая крепнет с каждой печатью.'
  - rscadd: 'Способности связи: Чутьё и Шёпот крови, Кровь за кровь, Ярость за брата
      и семь венцов клятв.'
  - rscadd: Братья выпадают и мидраундом; третьего брата можно принять только с его
      согласия, ушедшего - заменить.
  - rscadd: 'Контригра: шрам на ладони, майндшилд глушит связь, обряд священника и
      операция рвут клятву.'
  - rscadd: Окно «Кровная клятва», итоги раунда братьев и программа антаг-тренировки.
  - imageadd: Иконки кнопок, алертов, эффектов и HUD кровных братьев.
  - soundadd: Звуки клятвы, связи и разрыва.
  - rscdel: Режим traitorbro и старые цели братьев удалены.
  - rscadd: С клятвой каждый брат получает узелок станционных вещей под её шаги.
  - balance: Кровные братья не выпадают на старте Тим-Базы.
  - balance: Аура Ярости видна только братьям, смерть брата больше не сбивает остальных
      с ног.
  - rscadd: HK-51 собирается со встроенным тазером в предплечье.
  - balance: Одна из частей HK-51 теперь лежит в техтоннелях станции.
  - qol: При осмотре дроида HK видно, что его корпус бронирован.
